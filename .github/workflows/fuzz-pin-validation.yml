            }
          ')"
          test -n "$FUZZ_TARGET"
          cargo +"$FUZZ_TOOLCHAIN" fuzz build --target "$FUZZ_TARGET" --fuzz-dir tools/miden-crypto-fuzz "$TARGET"
          FUZZ_BIN="tools/miden-crypto-fuzz/target/$FUZZ_TARGET/release/$TARGET"
          test -x "$FUZZ_BIN"
          "$FUZZ_BIN" -max_total_time=60 -runs=10000

  fuzz-miden-serde-utils:
    name: fuzz miden-serde-utils (${{ matrix.target }})
    if: github.repository == 'huklaa/miden-vm'
    runs-on: ubuntu-latest
