        run: |
          FUZZ_TARGET="$(cargo +"$FUZZ_TOOLCHAIN" fuzz build --help | awk '
            $0 ~ /^      --target <TRIPLE>/ { in_target = 1; next }
            in_target && /\[default:/ {
